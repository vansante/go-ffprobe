on: [ push, pull_request ]
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [ 1.25.x ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v3.1
      with:
        ffmpeg-version: release

    - name: Test
      run: go test -v -timeout 2m ./...
